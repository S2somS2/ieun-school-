<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#166534">
  <title>2026 이은 E-페스티벌 정보경진대회</title>
  <style>
    :root { color-scheme: light; --green-950:#052e16; --green-800:#166534; --green-700:#15803d; --green-600:#16a34a; --green-100:#dcfce7; --yellow:#fde047; }
    * { box-sizing: border-box; }
    html { min-width: 320px; background:#f8fafc; }
    body { margin:0; min-height:100vh; overflow-x:hidden; color:#0f172a; background:#f8fafc; font-family:Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
    body::before { content:""; position:fixed; inset:0 0 auto; height:320px; z-index:-2; background:linear-gradient(135deg,#052e16,#166534 55%,#047857); }
    .display-font { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-weight: 900; }
    .grid-bg { position:fixed; inset:0; z-index:-1; pointer-events:none; background-image:linear-gradient(rgba(34,197,94,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.08) 1px,transparent 1px); background-size:28px 28px; }
    body > .grid-bg ~ div:not(.grid-bg) { pointer-events:none; }
    .glass { background: rgba(255,255,255,.9); backdrop-filter: blur(16px); }
    .neon-shadow { box-shadow: 0 18px 50px rgba(22,101,52,.18), 0 0 0 1px rgba(255,255,255,.7) inset; }
    header { width:min(1152px,100%); margin:auto; padding:28px 16px 0; }
    header nav { padding:14px 22px; border:1px solid #bbf7d0; border-radius:24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    header nav > div { display:flex; align-items:center; gap:12px; }
    header nav > div:first-child > div:first-child { width:64px; height:64px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; color:#fff; background:linear-gradient(135deg,#16a34a,#047857); box-shadow:0 8px 20px rgba(5,46,22,.2); outline:4px solid rgba(190,242,100,.7); }
    header nav p { margin:0 0 3px; color:#16a34a; font-size:14px; font-weight:900; letter-spacing:.12em; }
    header h1 { margin:0; color:#052e16; font-size:30px; line-height:1.15; }
    button { font:inherit; cursor:pointer; }
    #sound-btn { min-height:48px; padding:10px 16px; display:flex; align-items:center; gap:8px; border:2px solid #bbf7d0; border-radius:16px; color:#166534; background:#f0fdf4; font-weight:900; }
    main { width:min(1152px,100%); margin:auto; padding:40px 16px; display:flex; flex-direction:column; gap:24px; }
    main > section { border-radius:32px; }
    main > section:first-child { position:relative; overflow:hidden; padding:40px; color:#fff; background:linear-gradient(135deg,#052e16,#166534 55%,#047857); box-shadow:0 18px 50px rgba(22,101,52,.18); }
    main > section:first-child > div:first-child { position:absolute; top:18px; right:22px; font-size:70px; opacity:.12; }
    main > section:first-child > div:nth-child(2) { display:none; }
    main > section:first-child > div:last-child { position:relative; }
    main > section:first-child > div:last-child > div { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border:1px solid rgba(190,242,100,.5); border-radius:999px; color:#ecfccb; background:rgba(190,242,100,.14); font-weight:900; }
    #hero-title { margin:20px 0 0; font-size:clamp(42px,7vw,72px); line-height:1.05; }
    #hero-title span { color:var(--yellow); }
    #hero-title + p { max-width:720px; margin:16px 0 0; color:#dcfce7; font-size:20px; font-weight:700; line-height:1.7; }
    main > section:nth-of-type(2) { padding:36px; text-align:center; border:1px solid #dcfce7; background:rgba(255,255,255,.94); box-shadow:0 18px 50px rgba(22,101,52,.16); }
    main > section:nth-of-type(2) > div:first-child { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
    main > section:nth-of-type(2) > div:first-child > div { display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:999px; color:#15803d; background:#dcfce7; font-size:36px; font-weight:900; }
    #sentence-title { margin:0; font-size:inherit; }
    #speak-btn { min-height:56px; padding:12px 20px; display:flex; align-items:center; gap:8px; border:0; border-radius:16px; color:#fff; background:#16a34a; box-shadow:0 8px 18px rgba(22,163,74,.25); font-size:20px; font-weight:900; }
    #sentence-container { margin-top:28px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; }
    .word-card { transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .word-card { padding:12px 16px; border:2px solid #dcfce7; border-radius:16px; color:#052e16; background:#fff; box-shadow:0 3px 8px rgba(22,101,52,.06); font-size:clamp(24px,4vw,36px); font-weight:900; }
    .word-card:hover, .word-card:focus-visible { transform: translateY(-5px); box-shadow: 0 12px 24px rgba(22,163,74,.2); }
    .word-card:focus-visible, button:focus-visible { outline: 4px solid #facc15; outline-offset: 4px; }
    #number-highlight { padding:14px 24px; border:0; border-radius:24px; color:#fff; background:linear-gradient(90deg,#15803d,#10b981); box-shadow:0 12px 24px rgba(5,150,105,.28); font-size:clamp(38px,6vw,60px); font-weight:900; }
    main > section:nth-of-type(2) > p { margin:24px 0 0; color:#475569; font-weight:700; }
    main > section:nth-of-type(3) { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    article { padding:20px; display:flex; align-items:center; gap:16px; border:1px solid #dcfce7; border-radius:24px; background:rgba(255,255,255,.94); box-shadow:0 8px 22px rgba(22,101,52,.1); }
    article > div:first-child { width:56px; height:56px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:16px; background:#dcfce7; font-size:26px; }
    article p, article h3 { margin:0; }
    article p { color:#16a34a; font-size:14px; font-weight:900; }
    article h3 { margin-top:4px; color:#052e16; font-size:20px; }
    footer { padding:0 16px 24px; color:#475569; text-align:center; font-size:14px; font-weight:700; }
    .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    .bg-green-100 { background:#dcfce7!important; }
    .confetti-piece { position:fixed; z-index:9999; top:48%; left:50%; pointer-events:none; font-size:22px; animation:confetti-pop 1.3s ease-out forwards; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes pulse-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.5); } 50% { box-shadow: 0 0 0 12px rgba(250,204,21,0); } }
    @keyframes confetti-pop { from { opacity:1; transform:translate(-50%,-50%) rotate(0) scale(.5); } to { opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.25); } }
    .float { animation: float 4s ease-in-out infinite; }
    .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; }
    @media (max-width:760px) {
      header { padding-top:14px; }
      header nav { align-items:flex-start; padding:14px; }
      header nav > div:first-child > div:first-child { width:52px; height:52px; }
      header nav p { font-size:11px; }
      header h1 { font-size:20px; }
      #sound-text { display:none; }
      main { padding-top:24px; }
      main > section:first-child { padding:28px 22px; }
      #hero-title + p { font-size:16px; }
      main > section:nth-of-type(2) { padding:26px 16px; }
      main > section:nth-of-type(2) > div:first-child > div { font-size:28px; }
      main > section:nth-of-type(3) { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-slate-50 text-slate-900">
  <div class="fixed inset-0 grid-bg pointer-events-none"></div>
  <div class="fixed inset-x-0 top-0 h-80 bg-gradient-to-br from-green-950 via-green-800 to-emerald-700 -z-10"></div>
  <div class="fixed top-24 -left-12 w-48 h-48 rounded-full bg-teal-300/20 blur-3xl pointer-events-none"></div>
  <div class="fixed top-10 right-0 w-64 h-64 rounded-full bg-lime-300/20 blur-3xl pointer-events-none"></div>

  <header class="relative z-10 w-full max-w-6xl mx-auto px-4 pt-4 md:pt-7">
    <nav class="glass neon-shadow rounded-3xl px-4 py-3 md:px-6 md:py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between" aria-label="주요 기능">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 md:w-16 md:h-16 shrink-0 rounded-full bg-gradient-to-br from-green-600 to-emerald-700 text-white flex items-center justify-center shadow-lg ring-4 ring-lime-300/70" aria-hidden="true">
          <span class="display-font text-3xl md:text-4xl">e</span>
        </div>
        <div>
          <p class="text-xs md:text-sm font-black tracking-widest text-green-600">꿈 · 도전 · 디지털 세상</p>
          <h1 class="display-font text-xl sm:text-2xl md:text-3xl text-green-950 leading-tight">2026 이은 E-페스티벌 정보경진대회</h1>
        </div>
      </div>
      <div class="flex gap-2 self-end sm:self-auto">
        <button id="sound-btn" type="button" aria-pressed="true" class="min-h-12 rounded-2xl border-2 border-green-200 bg-green-50 px-4 font-black text-green-800 hover:bg-green-100 active:scale-95 transition flex items-center gap-2">
          <span id="sound-icon" aria-hidden="true">🔊</span><span id="sound-text">효과음 켜짐</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="relative z-10 w-full max-w-6xl mx-auto px-4 py-6 md:py-10 space-y-6">
    <section class="relative overflow-hidden rounded-[2rem] bg-gradient-to-br from-green-950 via-green-800 to-emerald-700 p-6 md:p-10 text-white neon-shadow" aria-labelledby="hero-title">
      <div class="absolute right-5 top-5 text-7xl text-white/10 float" aria-hidden="true">🏆</div>
      <div class="absolute -bottom-10 -left-8 w-40 h-40 rounded-full border-[24px] border-lime-300/15" aria-hidden="true"></div>
      <div class="relative">
        <div class="inline-flex items-center gap-2 rounded-full border border-lime-300/50 bg-lime-300/15 px-4 py-2 text-sm md:text-base font-black text-lime-100">
          <span aria-hidden="true">🏅</span> 모두가 주인공인 디지털 축제
        </div>
        <h2 id="hero-title" class="display-font mt-5 text-4xl sm:text-5xl md:text-7xl leading-tight">우리의 가능성을<br><span class="text-yellow-300">클릭!</span> 하세요</h2>
        <p class="mt-4 max-w-2xl text-base md:text-xl text-green-100 font-bold leading-relaxed">배우고, 도전하고, 함께 성장하는 이은학교 정보경진대회에 오신 것을 환영합니다.</p>
      </div>
    </section>

    <section class="glass neon-shadow rounded-[2rem] border border-green-100 p-5 md:p-9 text-center" aria-labelledby="sentence-title">
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <div class="inline-flex items-center gap-3 rounded-full bg-green-100 px-6 py-3 font-black text-green-700 text-3xl md:text-4xl">
          <span aria-hidden="true">⭐</span>
          <h2 id="sentence-title">오늘의 문제</h2>
        </div>
        <button id="speak-btn" type="button" class="min-h-14 rounded-2xl bg-green-600 px-5 py-3 text-lg md:text-xl font-black text-white shadow-lg hover:bg-green-700 active:scale-95 transition flex items-center gap-2" aria-label="오늘의 문제 읽어주기">
          <span aria-hidden="true">💬</span><span>읽어주기</span>
        </button>
      </div>
      <div id="sentence-container" class="mt-6 flex flex-wrap items-center justify-center gap-3 md:gap-4" aria-label="이은학교 학생 수는 모두 225명입니다">
        <button class="word-card rounded-2xl border-2 border-green-100 bg-white px-4 py-3 text-2xl sm:text-3xl md:text-4xl font-black text-green-950" type="button">이은학교</button>
        <button class="word-card rounded-2xl border-2 border-green-100 bg-white px-4 py-3 text-2xl sm:text-3xl md:text-4xl font-black text-green-950" type="button">학생 수는</button>
        <button class="word-card rounded-2xl border-2 border-green-100 bg-white px-4 py-3 text-2xl sm:text-3xl md:text-4xl font-black text-green-950" type="button">모두</button>
        <button id="number-highlight" type="button" class="pulse-ring rounded-3xl bg-gradient-to-r from-green-700 to-emerald-500 px-6 py-4 text-4xl sm:text-5xl md:text-6xl text-white font-black shadow-xl hover:scale-105 active:scale-95 transition" aria-label="225명, 축하 효과 보기">225명 <span class="text-2xl" aria-hidden="true">✨</span></button>
        <button class="word-card rounded-2xl border-2 border-green-100 bg-white px-4 py-3 text-2xl sm:text-3xl md:text-4xl font-black text-green-950" type="button">입니다!</button>
      </div>
      <p class="mt-6 text-sm md:text-base font-bold text-slate-600"><span aria-hidden="true">👆</span> 글자 카드를 눌러 소리를 듣고, <strong class="text-emerald-700">225명</strong>을 눌러 축하 폭죽을 터뜨려 보세요!</p>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-4" aria-label="대회 핵심 가치">
      <article class="glass rounded-3xl border border-green-100 p-5 shadow-lg flex items-center gap-4">
        <div class="w-14 h-14 shrink-0 rounded-2xl bg-green-100 text-green-600 flex items-center justify-center text-2xl" aria-hidden="true">🧠</div>
        <div><p class="text-sm font-black text-green-500">생각하는 힘</p><h3 class="text-xl font-black text-green-950">창의력 UP!</h3></div>
      </article>
      <article class="glass rounded-3xl border border-emerald-100 p-5 shadow-lg flex items-center gap-4">
        <div class="w-14 h-14 shrink-0 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl" aria-hidden="true">⌨️</div>
        <div><p class="text-sm font-black text-emerald-500">즐거운 도전</p><h3 class="text-xl font-black text-emerald-950">정보력 UP!</h3></div>
      </article>
      <article class="glass rounded-3xl border border-teal-100 p-5 shadow-lg flex items-center gap-4">
        <div class="w-14 h-14 shrink-0 rounded-2xl bg-teal-100 text-teal-600 flex items-center justify-center text-2xl" aria-hidden="true">🤝</div>
        <div><p class="text-sm font-black text-teal-600">함께하는 성장</p><h3 class="text-xl font-black text-teal-950">자신감 UP!</h3></div>
      </article>
    </section>
  </main>

  <footer class="relative z-10 text-center px-4 pb-6 text-sm font-bold text-slate-600">
    <p>2026 이은 E-페스티벌 정보경진대회 · 모두의 가능성이 빛나는 무대</p>
  </footer>

  <div id="live-message" class="sr-only" aria-live="polite"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let soundEnabled = true;
      let audioContext;
      const liveMessage = document.getElementById('live-message');

      function initAudio() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
      }
      function playNote(note = 'C5', duration = '8n') {
        if (!soundEnabled) return;
        const frequencies = { C4:261.63, D4:293.66, E4:329.63, G4:392, C5:523.25, E5:659.25, G5:783.99, C6:1046.5 };
        try {
          initAudio();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.value = frequencies[note] || 523.25;
          gain.gain.setValueAtTime(.0001, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.18, audioContext.currentTime + .015);
          gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + (duration === '4n' ? .45 : .25));
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(); oscillator.stop(audioContext.currentTime + (duration === '4n' ? .48 : .28));
        } catch (_) {}
      }
      function speakSentence() {
        playNote('G5', '16n');
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance('이은학교 학생 수는 모두 225명 입니다.');
        utterance.lang = 'ko-KR'; utterance.rate = .88; utterance.pitch = 1.05;
        window.speechSynthesis.speak(utterance);
      }
      function celebrate() {
        ['C5','E5','G5','C6'].forEach((note, i) => setTimeout(() => playNote(note, i === 3 ? '4n' : '8n'), i * 110));
        const symbols = ['🎉','✨','⭐','💚','🏆'];
        for (let i = 0; i < 48; i += 1) {
          const piece = document.createElement('span');
          piece.className = 'confetti-piece';
          piece.textContent = symbols[i % symbols.length];
          const angle = Math.random() * Math.PI * 2;
          const distance = 120 + Math.random() * 300;
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          piece.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
          piece.style.animationDelay = `${Math.random() * .15}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }
        liveMessage.textContent = '축하합니다! 이은학교 학생 225명 모두가 주인공입니다.';
      }

      document.getElementById('speak-btn').addEventListener('click', speakSentence);
      const soundBtn = document.getElementById('sound-btn');
      const soundIcon = document.getElementById('sound-icon');
      const soundText = document.getElementById('sound-text');
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.setAttribute('aria-pressed', String(soundEnabled));
        soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
        soundText.textContent = soundEnabled ? '효과음 켜짐' : '효과음 꺼짐';
        if (soundEnabled) playNote('C5', '16n');
      });
      const notes = ['C4','D4','E4','G4'];
      document.querySelectorAll('.word-card').forEach((card, index) => {
        card.addEventListener('click', () => {
          playNote(notes[index % notes.length]);
          card.classList.add('bg-green-100');
          setTimeout(() => card.classList.remove('bg-green-100'), 250);
        });
      });
      document.getElementById('number-highlight').addEventListener('click', celebrate);
    });
  </script>
</body>
</html>
